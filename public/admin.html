<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Cổng Vũ Trụ của Thần Ra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #080321; color: #f4ecff; font: 15px/1.5 'Be Vietnam Pro', system-ui, sans-serif; padding: 22px; max-width: 1180px; margin: auto; }
  h1 { color: #f1c453; font-size: 24px; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }
  h2 { color: #f1c453; font-size: 15px; letter-spacing: 0.8px; margin: 0 0 12px; text-transform: uppercase; border-bottom: 1px solid rgba(241,196,83,.25); padding-bottom: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 16px; }
  .box { border: 1px solid rgba(241,196,83,.45); border-radius: 14px; padding: 16px; background: rgba(22, 9, 68, 0.72); box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  label { display: block; margin: 8px 0 4px; font-weight: 600; font-size: 13.5px; color: #ffeaa8; }
  input[type="text"], input[type="number"], select { background: #12063a; color: #fff; border: 1px solid #6a4fd0; border-radius: 8px; padding: 8px 10px; font: inherit; width: 100%; margin: 2px 0 6px; outline: none; }
  input[type="range"] { width: 100%; accent-color: #f1c453; margin: 4px 0; }
  .chk-row { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-weight: 600; color: #fff; cursor: pointer; }
  .chk-row input { width: 18px; height: 18px; accent-color: #f1c453; cursor: pointer; }
  button { background: #3b1fa8; color: #fff; border: 1px solid #f1c453; border-radius: 8px; padding: 8px 13px; font: 600 13.5px inherit; cursor: pointer; margin: 3px 4px 3px 0; transition: all .2s; }
  button:hover { background: #6b2cf5; transform: translateY(-1px); }
  button.gold { background: linear-gradient(135deg, #b8791a, #f1c453); color: #12063a; font-weight: 800; }
  pre { background: #05020f; border: 1px solid rgba(106,79,208,.4); border-radius: 8px; padding: 10px; max-height: 240px; overflow: auto; font-size: 12.5px; white-space: pre-wrap; color: #e2d4ff; }
  .q span { display: inline-block; background: #12063a; border: 1px solid #6a4fd0; border-radius: 12px; padding: 3px 10px; margin: 2px; font-size: 13px; }
  .mp3-bar { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .status-tag { display: inline-block; margin-top: 8px; font-size: 13px; color: #3de8ff; font-weight: 600; }
</style>
</head>
<body>
<h1>☀️ Admin — Cổng Vũ Trụ của Thần Ra</h1>

<div class="grid">
  <!-- KẾT NỐI TIKTOK LIVE -->
  <div class="box">
    <h2>Kết nối TikTok Live</h2>
    <label>Tài khoản TikTok (@username hoặc link live)</label>
    <input id="uname" type="text" placeholder="@username hoặc link vt.tiktok.com">
    <div>
      <button class="gold" onclick="rpc('live.connect',{username:uname.value})">Kết nối Live</button>
      <button onclick="rpc('live.disconnect')">Ngắt kết nối</button>
      <button onclick="rpc('live.setAutoSim',{enabled:true})">Bật Demo tự động</button>
      <button onclick="rpc('live.setAutoSim',{enabled:false})">Tắt Demo</button>
    </div>
    <div id="conn" class="status-tag">Chưa kết nối</div>
  </div>

  <!-- GIẢ LẬP SỰ KIỆN & ĐẶT CÂU HỎI -->
  <div class="box">
    <h2>Giả lập sự kiện & Câu hỏi</h2>
    <label>Tên người xem</label>
    <input id="u" type="text" value="Minh Tâm" placeholder="Tên người xem">
    
    <label>Câu hỏi / Bình luận (Nếu tặng quà sẽ đọc theo câu hỏi này)</label>
    <input id="txt" type="text" value="Tháng này công việc của mình có thuận lợi không?" placeholder="Nhập câu hỏi hoặc lời cầu nguyện...">
    
    <div style="margin-top:8px">
      <button onclick="ev('tarot.like',{count:8})">💖 Thả tim (Vào Sảnh Thường)</button>
      <button onclick="ev('tarot.follow')">⭐ Follow (Sảnh Ưu Tiên)</button>
      <button onclick="ev('tarot.share')">🔁 Share</button>
    </div>
    <div style="margin-top:4px">
      <button class="gold" onclick="ev('tarot.gift',{coins:5,giftName:'Quà 01-10 xu',question:txt.value})">🎁 Quà 01–10 xu (1 lá)</button>
      <button class="gold" onclick="ev('tarot.gift',{coins:30,giftName:'Quà 11-99 xu',question:txt.value})">🎁 Quà 11–99 xu (2 lá)</button>
      <button class="gold" onclick="ev('tarot.gift',{coins:199,giftName:'Quà >99 xu',question:txt.value})">👑 Quà &gt;99 xu (3 lá)</button>
    </div>
    <div style="margin-top:4px">
      <button onclick="ev('tarot.comment',{text:txt.value})">💬 Gửi bình luận / Câu hỏi</button>
      <button onclick="ev('tarot.pray',{wish:txt.value})">🏮 Thả đèn cầu nguyện</button>
      <button onclick="ev('tarot.claim')">✨ Claim nhận bài</button>
    </div>
  </div>

  <!-- ĐIỀU KHIỂN ÂM THANH, NHẠC NỀN & GIỌNG ĐỌC -->
  <div class="box">
    <h2>Điều khiển Âm thanh & Giọng đọc</h2>
    <div>
      <button onclick="rpc('tarot.skip')">⏭ Bỏ qua lượt đang đọc</button>
      <button onclick="if(confirm('Xoá toàn bộ hàng chờ?'))rpc('tarot.reset')">🗑 Reset hàng chờ</button>
    </div>

    <label>Chọn nhạc nền MP3 (Phát trên màn hình Live)</label>
    <div class="mp3-bar">
      <input type="file" id="admMp3" accept="audio/mp3,audio/*" style="font-size:13px">
      <button onclick="rpc('audio.control',{action:'toggle'})">⏯ Phát/Dừng</button>
    </div>

    <label>Âm lượng nhạc nền</label>
    <input type="range" min="0" max="1" step=".05" id="mv" onchange="rpc('tarot.updateSettings',{musicVolume:+mv.value})">

    <label>Chọn giọng đọc tiếng Việt</label>
    <select id="vp" onchange="rpc('tarot.updateSettings',{ttsVoice:vp.value})">
      <option value="vi-VN-nu">Giọng Nữ Huyền Bí (vi-VN)</option>
      <option value="vi-VN-nam">Giọng Nam Trầm Ấm (vi-VN)</option>
      <option value="maichi">ZeroTTS — Mai Chi</option>
    </select>

    <label>Âm lượng giọng đọc Ra</label>
    <input type="range" min="0" max="1" step=".05" id="tv" onchange="rpc('tarot.updateSettings',{ttsVolume:+tv.value})">

    <label class="chk-row">
      <input type="checkbox" id="tts" onchange="rpc('tarot.updateSettings',{ttsEnabled:tts.checked})">
      <span>Bật giọng đọc bài (Tổng)</span>
    </label>

    <label class="chk-row">
      <input type="checkbox" id="ntts" onchange="rpc('tarot.updateSettings',{normalTtsEnabled:ntts.checked})">
      <span>Bật giọng đọc bài cho hàng Sảnh Thường</span>
    </label>

    <div style="display:grid;grid
